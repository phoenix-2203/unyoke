<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/icon-180.png?v=2" />
    <meta name="theme-color" content="#07080a" />
    <meta name="description" content="See every permission your QoreChain account has given away, on both lanes, and take it back." />
    <meta property="og:title" content="Unyoke" />
    <meta property="og:description" content="See every permission your QoreChain account has given away, on both lanes, and take it back." />
    <meta property="og:image" content="https://unyoke.duckdns.org/og.png" />
    <meta property="og:url" content="https://unyoke.duckdns.org/" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Unyoke</title>
    <script>
      // Pick the theme before the first paint so a light visitor never sees a dark flash.
      (function () {
        var t = null;
        try { t = localStorage.getItem("unyoke-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
        if (t === "light") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f5f4ef");
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
